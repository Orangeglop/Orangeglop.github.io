about_me_text:
  en: >-
    Hello, I'm <strong class="author-name">%AUTHOR_NAME%</strong> 👋, an urban planner, designer, and landscape enthusiast currently based in The Netherlands.
    I hold an MSc in Urbanism, Landscape and Planning from KU Leuven and a BSc in Urban and Regional Planning from Ho Chi Minh University of Architecture.
    I work on spatial master plans, public realm designs, and sustainable regional strategies, combining rigorous spatial analysis with clear visual communication.
    I am actively learning Dutch (B1) and open to new career opportunities and relocation within The Netherlands.
  nl: >-
    Hallo, ik ben <strong class="author-name">%AUTHOR_NAME%</strong> 👋, stedenbouwkundig ontwerper en liefhebber van landschappen, momenteel woonachtig in Nederland.
    Ik heb een MSc in Urbanism, Landscape and Planning behaald aan de KU Leuven en een BSc in Urban and Regional Planning aan de Architectuuruniversiteit van Ho Chi Minhstad.
    Ik werk aan ruimtelijke masterplannen, openbare ruimte ontwerpen en duurzame regionale strategieën, waarbij ik grondige ruimtelijke analyses combineer met heldere visuele communicatie.
    Ik leer actief Nederlands (B1) en sta open voor nieuwe carrièremogelijkheden en verhuizing binnen Nederland.

