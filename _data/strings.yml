about_me_text:
  en:
    Hello, I'm <strong class="author-name">%AUTHOR_NAME%</strong> 👋, an urban planner, designer, and a landscape enthusiast.<br>
    I'm currently living in The Netherlands and working as a freelance planner and designer for several projects in Southeast Asia.
    This website is created to store my most up-to-date portfolio and featured works. I am also learning Dutch to improve my communication skills. I'm open to work and willingly to relocate within The Netherlands.
  nl:
    Hallo, ik ben <strong class="author-name">%AUTHOR_NAME%</strong> 👋, stedenbouwkundig ontwerper, landschapsontwerper en liefhebber van landschappen.<br>
    Momenteel woon ik in Nederland, en werk ik aan verschillende projecten in Zuidoost-Azië.
    Op deze website presenteer ik mijn meest recente werk en projecten. Om mijn communicatie verbeteren, leer ik actief Nederlands. Daarnaast sta ik open voor nieuwe kansen en ben ik bereid om binnen Nederland te verhuizen als dat nodig is.

