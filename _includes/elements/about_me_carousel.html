<div id="carouselAboutMe" class="site-carousel carousel-about carousel slide" data-ride="carousel" data-interval="5000">
  <ol class="carousel-indicators">
  {% for image in site.data.images_aboutme %}
      <li data-target="#carouselAboutMe" data-slide-to="{{ forloop.index0 }}" class="{% if forloop.first %}active{% endif %}"></li>
  {% endfor %}
  </ol>

  <div class="carousel-inner">
    {% for image in site.data.images_aboutme %}
      <div class="carousel-item {% if forloop.first %}active{% endif %}">
        <img src="{{ image.path | relative_url }}" class="carousel-img" alt="About Me">
      </div>
    {% endfor %}
  </div>

  <button class="carousel-control-prev" type="button" data-target="#carouselAboutMe" data-slide="prev" aria-label="Previous Slide" data-umami-event="About Carousel: Prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </button>

  <button class="carousel-control-next" type="button" data-target="#carouselAboutMe" data-slide="next" aria-label="Next Slide" data-umami-event="About Carousel: Next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </button>
</div>
