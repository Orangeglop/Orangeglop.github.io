{%- if site.analytics.enabled == true and site.analytics.website_id and site.analytics.website_id != '' -%}
  <!-- Umami Analytics (Cookieless & Privacy-friendly) -->
  <script defer
          src="{{ site.analytics.host_url | default: 'https://cloud.umami.is' }}/script.js"
          data-website-id="{{ site.analytics.website_id }}"
          {%- if site.analytics.domains %} data-domains="{{ site.analytics.domains }}"{%- endif -%}>
  </script>
{%- endif -%}
