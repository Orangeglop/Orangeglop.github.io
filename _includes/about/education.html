{% assign current_lang = page.lang | default: 'en' %}

<div class="about-section" style="width: 100%; margin-top: 2.5rem;" data-reveal>
  <div class="section-header">
    <h2 class="section-title">{{ include.title | default: "Education" }}</h2>
  </div>

  <div class="education-grid">
    {% for item in site.data.education[current_lang] %}
      <div class="education-card">
        <span class="badge badge-primary education-degree-badge">{{ item.degree }}</span>
        <h3 class="education-area">{{ item.area }}</h3>
        <div class="education-institution">{{ item.institution }}</div>
        <div class="education-meta">
          <span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: -2px; margin-right: 3px;">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            {{ item.location }}
          </span>
          &bull;
          <span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: -2px; margin-right: 3px;">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            {{ item.end_date }}
          </span>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
