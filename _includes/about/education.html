<div class="col mt-4">
  <div class="timeline-body bg-themed">
    {% for item in site.data.education %}
      <div class="timeline-item">
        <div class="content">
          <h2>{{ item.area }} ({{ item.degree }})</h2>
          <h5 style="font-size:80%">{{ item.end_date }}</h5>
          <p>{{ item.institution }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
