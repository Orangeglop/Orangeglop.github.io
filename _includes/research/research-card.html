{% if item.external_url %}
  {% assign research_url = item.external_url %}
{% else %}
  {% assign research_url = item.url | relative_url %}
{% endif %}

{% assign post_image = item.image | default: item.thumbnail %}

<a href="{{ research_url }}"
   class="research-card"
   {% if item.external_url and site.open_new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}>
  {% if post_image %}
    <div class="research-card-media">
      <img src="{{ post_image | relative_url }}"
           class="research-card-img"
           alt="{{ item.title }}"
           loading="lazy">
    </div>
  {% endif %}
  <div class="research-card-body">
    <h3 class="research-card-title">{{ item.title }}</h3>
  </div>
</a>
