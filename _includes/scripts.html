<!-- jQuery CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- Bootstrap Bundle JS CDN (Includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- wow.js CDN & Activation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"></script>
<script> new WOW().init(); </script>

<!-- FlipBook Viewer -->
<script src="{{ '/assets/js/flipbook.js' | relative_url }}"></script>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<!-- Custom PDF Viewer -->
<script src="{{ '/assets/js/pdf-viewer.js' | relative_url }}"></script>

<!-- Initialize Bootstrap tooltips and touch blur handlers -->
<script>
  $(function () {
    $('[data-toggle="tooltip"]').tooltip();
  });

  document.addEventListener('touchend', function (e) {
    var btn = e.target.closest('.carousel-control-prev, .carousel-control-next');
    if (btn) {
      setTimeout(function () { btn.blur(); }, 80);
    }
  }, { passive: true });

  /* Prevent page jumping/scrolling when clicking carousel controls */
  document.addEventListener('click', function (e) {
    var control = e.target.closest('.carousel-control-prev, .carousel-control-next, .carousel-indicators li');
    if (control) {
      e.preventDefault();
    }
  });

  /* Track any direct PDF downloads across the site */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href*=".pdf"]');
    if (a && !a.closest('.pv-modal, .fb-modal') && !a.classList.contains('btn-pdf-viewer') && !a.hasAttribute('data-pdf-viewer')) {
      var href = a.getAttribute('href') || '';
      var cleanName = href.split('/').pop().split('?')[0];
      try { cleanName = decodeURIComponent(cleanName).replace(/\.pdf$/i, ''); } catch (err) {}
      var title = a.getAttribute('title') || cleanName;
      if (window.umami && typeof window.umami.track === 'function') {
        window.umami.track('Download PDF: ' + title, { file: cleanName, url: href });
      }
    }
  }, { passive: true });
</script>
