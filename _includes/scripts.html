<!-- jQuery CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<!-- Bootstrap Bundle JS CDN (Includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- wow.js CDN & Activation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"></script>
<script> new WOW().init(); </script>

<!-- FlipBook Viewer -->
<script src="{{ '/assets/js/flipbook.js' | relative_url }}"></script>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<!-- Custom PDF Viewer -->
<script src="{{ '/assets/js/pdf-viewer.js' | relative_url }}"></script>

<!-- Initialize Bootstrap tooltips and touch blur handlers -->
<script>
  $(function () {
    $('[data-toggle="tooltip"]').tooltip();
  });

  document.addEventListener('touchend', function (e) {
    var btn = e.target.closest('.carousel-control-prev, .carousel-control-next');
    if (btn) {
      setTimeout(function () { btn.blur(); }, 80);
    }
  }, { passive: true });
</script>
