<link href="{{ '/assets/dflip/css/dflip.min.css' | relative_url }}" rel="stylesheet" type="text/css">
<link href="{{ '/assets/dflip/css/themify-icons.min.css' | relative_url }}" rel="stylesheet" type="text/css">

<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
<script src="{{ '/assets/dflip/js/libs/jquery.min.js' | relative_url }}"></script>
<script src="{{ '/assets/dflip/js/dflip.min.js' | relative_url }}"></script>

<div class="row justify-content-center align-items-center p-4">
  <div class="text-center mt-4">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 df_thumb-container">
              <div
                class="_df_thumb"
                thumb="{{ 'assets/portfolio/urban.webp' | relative_url }}"
                id="button_pdf_urban">
                  Portfolio
              </div>
            </div>
            <div class="col-12 col-md-6 df_thumb-container">
              <div
                class="_df_thumb"
                thumb="{{ 'assets/portfolio/landscape.webp' | relative_url }}"
                id="button_pdf_landscape">
                  Portfolio
              </div>
            </div>
        </div>

        <div class="text-center mt-3">
          <p class="text-muted wow animated slideInUp" data-wow-delay=".15s">{{ site.description }}</p>
        </div>

        <script>
          var option_button_pdf_landscape = {
            source: Array.from({ length: 26 }, (_, i) => `/assets/portfolio/landscape/page-${i+1}.webp`),
            webgl:true,
            webglShadow: true,
            shadowOpacity: 0.2,
            soundEnable: false,
            pageMode: DFLIP.PAGE_MODE.DOUBLE,
            singlePageMode: DFLIP.SINGLE_PAGE_MODE.AUTO,
            zoomRatio: 1.5,
            stiffness: 0,
            backgroundColor: "#b8a8cbcc",
            transparent: true,
            hard: "cover",
            allControls: "startPage,altPrev,pageNumber,altNext,zoomIn,zoomOut,pageMode,fullScreen",
            onCreateUI: function (flipBook) {
              var downloadUrl = "/assets/portfolio/%5BTRAN%5D%20PORTFOLIO_LANDSCAPE_2025.pdf"
              var downloadButton = jQuery('<a class="df-ui-btn ti-download df-ui-custom-download-button" download target="_blank"></a>');
              downloadButton.attr("href",downloadUrl).attr("title","Download PDF");
              flipBook.ui.zoomOut.after(downloadButton);
            },
          };
        </script>

        <script>
          var option_button_pdf_urban = {
            source: Array.from({ length: 32 }, (_, i) => `/assets/portfolio/urban/page-${i+1}.webp`),
            webgl:true,
            webglShadow: true,
            shadowOpacity: 0.2,
            soundEnable: false,
            pageMode: DFLIP.PAGE_MODE.DOUBLE,
            singlePageMode: DFLIP.SINGLE_PAGE_MODE.AUTO,
            zoomRatio: 1.5,
            stiffness: 0,
            backgroundColor: "#b8a8cbcc",
            transparent: true,
            hard: "cover",
            allControls: "startPage,altPrev,pageNumber,altNext,zoomIn,zoomOut,pageMode,fullScreen",
            onCreateUI: function (flipBook) {
              var downloadUrl = "/assets/portfolio/%5BTRAN%5D%20PORTFOLIO_URBAN_2025.pdf"
              var downloadButton = jQuery('<a class="df-ui-btn ti-download df-ui-custom-download-button" download target="_blank"></a>');
              downloadButton.attr("href",downloadUrl).attr("title","Download PDF");
              flipBook.ui.zoomOut.after(downloadButton);
            },
          };
        </script>


    </div>
  </div>
</div>
